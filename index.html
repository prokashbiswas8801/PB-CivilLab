    <script>
      (function() {
        // 1. Multi-layer fetch writable shim (window, Window.prototype, and prototype chain)
        try {
          var _origFetch = window.fetch;
          var _activeFetch = _origFetch;
          var desc = {
            get: function() { return _activeFetch || window.fetch; },
            set: function(val) { _activeFetch = val; },
            configurable: true,
            enumerable: true
          };

          try { Object.defineProperty(window, 'fetch', desc); } catch (_) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            }
          } catch (_) {}
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              Object.defineProperty(proto, 'fetch', desc);
            }
          } catch (_) {}
        } catch (_) {}

        // 2. Suppress unhandled third-party extension injection exceptions
        function isExtError(msg, src) {
          var s = (String(src) + ' ' + String(msg)).toLowerCase();
          return (
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('cannot set property fetch') !== -1 ||
            s.indexOf('which has only a getter') !== -1 ||
            s.indexOf('libs/requests.js') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          var msg = (event.message || (event.error && event.error.message) || '') + '';
          var src = (event.filename || '') + '';
          if (isExtError(msg, src)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isExtError(msg, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        // 3. Early Accent Theme initialization from localStorage
        try {
          var savedAccent = localStorage.getItem('pb_civillab_accent_theme');
          if (savedAccent) {
            document.documentElement.setAttribute('data-accent', savedAccent);
          }
        } catch (e) {}
      })();
    </script>
