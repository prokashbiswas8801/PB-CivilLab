    <script>
      // 0. GitHub Pages Auto-Route: If deployed at root without /docs/, seamlessly route to /docs/
      if (typeof window !== 'undefined' && window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
        var p = window.location.pathname.replace(/\/+$/, '');
        window.location.replace(p + '/docs/' + window.location.search + window.location.hash);
      }
    </script>
    <script>
      // 1. Guard against environments where window.fetch has only a getter without a setter
      (function() {
        try {
          var _nativeFetch = window.fetch;
          var _activeFetch = function() {
            return (_nativeFetch || window.fetch).apply(window, arguments);
          };
          Object.defineProperty(window, 'fetch', {
            get: function() { return _activeFetch; },
            set: function(val) { _activeFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();

      // 2. Wrap WebSocket to silently handle Vite HMR connection closure in proxy environments
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function SafeWebSocket(url, protocols) {
            var ws = protocols ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
            ws.addEventListener('error', function(event) {
              event.stopImmediatePropagation && event.stopImmediatePropagation();
            });
            return ws;
          }
          SafeWebSocket.prototype = NativeWebSocket.prototype;
          SafeWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          SafeWebSocket.OPEN = NativeWebSocket.OPEN;
          SafeWebSocket.CLOSING = NativeWebSocket.CLOSING;
          SafeWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = SafeWebSocket;
        }

        function isWsError(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return str.indexOf('websocket') !== -1 || str.indexOf('ws://') !== -1 || str.indexOf('wss://') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = (event.message || (event.error && event.error.message) || '') + '';
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
